models:
  - name: deepseek-v4-flash-vision-exp
    display_name: DeepSeek-V4-Flash-Vision-Exp
    use: focus.models.deepseek:DeepSeekChatOpenAI
    model: deepseek-v4-flash-vision-exp
    context_window: 131072
    api_key: $OPENAI_API_KEY
    base_url: https://api.deepseek.com

  - name: deepseek-v4-flash
    display_name: Other OpenAI-compatible / deepseek-v4-flash
    use: focus.models.deepseek:DeepSeekChatOpenAI
    model: deepseek-v4-flash
    context_window: 131072
    api_key: $OPENAI_API_KEY
    base_url: https://api.deepseek.com

  # 视觉模型(spatial-patrol 空间观察与 dsh-eyes 视觉插件共用,DeepSeek V4 为 text-only):
  # qwen3.7-plus 为多模态模型(DashScope OpenAI 兼容模式),key 走 $VISION_API_KEY(.env)。
  - name: qwen3.7-plus
    display_name: Vision / qwen3.7-plus (DashScope)
    use: langchain_openai:ChatOpenAI
    model: qwen3.7-plus
    context_window: 128000
    api_key: $VISION_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

stream_bridge:
  type: memory
  queue_maxsize: 512

# 承诺层（commitment-layer）：本地 PoC 运行已开启。
# 开启后仅当最后一条用户消息（剥离前导 skill token 后）为 /commit <非空指令> 时，
# 在 lead agent 执行前运行九阶段承诺流程。
commitment:
  enabled: true

# human-in-the-loop 压缩门：仅主 Agent 装配。模型调用前估算 messages 用量，
# 超过 context_window × threshold_ratio 时 interrupt 暂停并发起压缩请求。
# 0.9 × 131072 ≈ 118k（接近窗口上限才触发，避免频繁打断）。
compression:
  enabled: true
  threshold_ratio: 0.9

# 设计决策 11：全应用迁移到 PostgreSQL checkpointer/store。
# Web 网关链路随之从内存态转为持久态（checkpoint 跨重启保留、rollback 生效、跨线程 store 记忆开启）。
checkpointer:
  type: postgres

langgraph_store:
  backend: async_postgres
  vector_enabled: false
  embed: text-embedding-v4
  dims: 1024
  fields: ["$"]

database:
  backend: postgres
  url: postgresql+asyncpg://focus:qweasdzxc123@127.0.0.1:7221/focus
  echo: false
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_pre_ping: true
  pool_recycle: -1
  isolation_level: READ COMMITTED
