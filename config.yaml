models:
  - name: deepseek-v4-flash
    display_name: Other OpenAI-compatible / deepseek-v4-flash
    use: focus.models.deepseek:DeepSeekChatOpenAI
    model: deepseek-v4-flash
    context_window: 131072
    api_key: $OPENAI_API_KEY
    base_url: https://api.deepseek.com

stream_bridge:
  type: memory
  queue_maxsize: 512

# 承诺层（commitment-layer）：本地 PoC 运行已开启。
# 开启后仅当最后一条用户消息（剥离前导 skill token 后）为 /commit <非空指令> 时，
# 在 lead agent 执行前运行九阶段承诺流程。
commitment:
  enabled: true

# human-in-the-loop 压缩门：仅主 Agent 装配。模型调用前估算 messages 用量，
# 超过 context_window × threshold_ratio 时 interrupt 暂停并发起压缩请求。
# 压缩测试配置：0.0763 × 131072 ≈ 10000（原默认 0.9 ≈ 118k）。
compression:
  enabled: true
  threshold_ratio: 0.0763

# 设计决策 11：全应用迁移到 PostgreSQL checkpointer/store。
# Web 网关链路随之从内存态转为持久态（checkpoint 跨重启保留、rollback 生效、跨线程 store 记忆开启）。
checkpointer:
  type: postgres

langgraph_store:
  backend: async_postgres
  vector_enabled: false
  embed: text-embedding-v4
  dims: 1024
  fields: ["$"]

database:
  backend: postgres
  url: postgresql+asyncpg://focus:qweasdzxc123@localhost:7221/focus
  echo: false
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_pre_ping: true
  pool_recycle: -1
  isolation_level: READ COMMITTED
