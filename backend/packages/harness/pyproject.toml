[project]
name = "focus-harness"
version = "0.1.0"
description = "Focus agent harness — focus core runtime"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-openai>=0.3.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.0",
    "pypdf>=5.0",
    "pypdfium2>=4.0",
    "pytesseract>=0.3",
    "python-docx>=1.0",
    "olefile>=0.47",
    "PyJWT>=2.0",
    "bcrypt>=4.0",
    "python-dotenv>=1.0",
]
[project.optional-dependencies]
mcp = ["langchain-mcp-adapters>=0.1.0"]
postgres = ["asyncpg", "langgraph-checkpoint-postgres", "psycopg[binary]>=3.2"]
sqlite = ["aiosqlite"]
aiosandbox = ["agent-sandbox", "docker"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["focus*"]

[tool.setuptools.package-dir]
"" = "."
