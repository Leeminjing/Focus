name: focus-spatial-patrol-docx

services:
  documentserver:
    image: onlyoffice/documentserver:9.4.0
    container_name: focus-spatial-patrol-documentserver
    restart: "no"
    ports:
      - "127.0.0.1:${DOCX_DS_PORT:-18080}:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${DOCX_DS_JWT_SECRET:?DOCX_DS_JWT_SECRET is required}"
      JWT_HEADER: AuthorizationJwt
      JWT_IN_BODY: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks:
      - docx_plugin

networks:
  docx_plugin:
    name: focus-spatial-patrol-docx
    internal: false
