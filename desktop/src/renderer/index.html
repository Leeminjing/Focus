<!doctype html>
<!--
  本文件提供 Focus 桌面宿主的持久挂载结构。输入为 app.js 的同源数据与原生 DOM 更新，
  输出为受内容安全策略保护的六项主导航、默认 Patrol、传统任务三栏、Patrol 工作台、检查器、
  材料 Blob 加载器、浮层、对话框和可复用模板。具体工作流为先约束资源来源，再加载 Expansion 预算模块、无状态 UI、共享 Run 订阅/短预览、共享图纯布局、Live Loop schema/reducer/连接器、共享授权/只读会话检查与材料 loader，加载独立 Patrol 文档/来源/编排/交互/检查/分支模块，最后启动 app.js。
  示例：浏览器加载 index.html 后由 app.js 挂载 #app。
  工作区输入编排与材料预览由共享 intake/preview 加载，原生宿主将输入入口转给独立机器人面板。
-->

  <template id="reviewTemplate">
    <article class="review-panel">
      <header>
        <div>

        </div>

      <pre class="review-draft"></pre>
      <textarea class="review-contract-editor" aria-label="任务合同 Markdown" hidden data-i18n-aria-label="review.contract_markdown"></textarea>
      <p class="review-error" role="alert"></p>
      <div class="review-actions">
        <button class="primary approve-button" type="button" data-i18n="review.approve">批准并继续</button>
        <button class="text-button revise-toggle" type="button" data-i18n="review.revise">提出修订</button>
      </div>
      <form class="revision-form" hidden>
        <div class="segmented" role="group" aria-label="修订方式" data-i18n-aria-label="review.revision_mode">
          <button class="active" type="button" data-mode="feedback" data-i18n="review.feedback">反馈</button>
          <button type="button" data-mode="replacement" data-i18n="review.replace">替换草稿</button>
        </div>
        <textarea class="revision-input" rows="4" placeholder="输入需要调整的内容" data-i18n-placeholder="review.revision_placeholder"></textarea>
        <div class="revision-footer">
          <button class="text-button cancel-revision" type="button" data-i18n="access.risk_cancel">取消</button>
          <button class="primary" type="submit" data-i18n="review.submit">提交修订</button>
        </div>
      </form>
    </article>
  </template>
  <template id="accessReviewTemplate">
    <article class="access-review-panel" data-subject="main">
      <header>
        <div>
          <span class="access-review-kicker" data-i18n="access.panel_title">本机资源访问请求</span>
          <h3 class="access-review-subject"></h3>
        </div>
        <span class="access-review-badge" data-i18n="access.badge">等待批准</span>
      </header>
      <dl class="access-review-fields"></dl>
      <p class="access-review-error" role="alert"></p>
      <div class="access-review-actions">
        <button class="primary approve-once-button" type="button" data-access-action="approve_once" data-i18n="access.approve_once">仅允许这一次</button>
        <button class="text-button reject-button" type="button" data-access-action="reject" data-i18n="access.reject">拒绝</button>
        <button class="text-button" type="button" data-access-action="cancel" data-i18n="access.cancel">取消</button>
        <button class="text-button switch-full-button" type="button" data-access-action="switch_full" data-i18n="access.switch_requested">修改常驻模式</button>
      </div>
      <section class="access-review-risk" hidden></section>
    </article>
  </template>
  <template id="traceTemplate">
