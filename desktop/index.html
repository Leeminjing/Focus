<!doctype html>
<!--
  本文档提供 Focus 桌面宿主的持久挂载结构。输入为 app.js 的同源数据与原生 DOM 更新，
  输出为全局导航、任务上下文、工作区、检查器、常驻会话 Patrol 小兵、浮层、对话框和可复用模板。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Focus</title>
  <link rel="icon" href="./assets/focus-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./skill-picker.css">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/icons.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/shell.css">
  <link rel="stylesheet" href="./styles/views.css?v=20260906a">
  <link rel="stylesheet" href="./styles/map-collapsible-view.css?v=20260902">
  <link rel="stylesheet" href="./styles/conversation-events.css">
  <link rel="stylesheet" href="./styles/patrol-avatar.css?v=20260905b">
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <button class="app-mark" data-action="toggle-nav-collapse" aria-controls="appNavigation" aria-expanded="true" aria-label="收起导航" data-i18n-aria-label="nav.collapse"><img src="./assets/focus-icon.png" alt="" aria-hidden="true"></button>
      <div class="shell-task-context" aria-live="polite">
        <strong id="shellTaskTitle" data-i18n="header.no_task">尚未选择任务</strong>
        <span id="shellTaskMeta" data-i18n="header.workbench">本地 Agent 工作台</span>
      </div>
      <span id="globalStatus" class="global-status" role="status" aria-atomic="true"></span>
      <button class="quiet-button" data-action="new-task"><span class="ui-icon is-sm icon-plus" aria-hidden="true"></span><span data-i18n="header.new_task">新增任务</span></button>
    </header>
    <div class="app-shell">
      <nav id="appNavigation" class="app-navigation" aria-label="全局导航">
        <button class="app-nav-item" data-action="focus-home" data-nav-key="focus">
          <span class="app-nav-label" data-i18n="nav.tasks">任务</span>
        </button>
        <button class="app-nav-item" data-action="show-map" data-nav-key="map">
          <span class="app-nav-label" data-i18n="nav.map">全图</span>
        </button>
        <button class="app-nav-item" data-action="show-contexts" data-nav-key="contexts">
          <span class="app-nav-label" data-i18n="nav.contexts">上下文</span>
        </button>
        <button class="app-nav-item" data-action="show-agents" data-nav-key="agents">
          <span class="app-nav-label" data-i18n="nav.agents">代理</span>
        </button>
        <button class="app-nav-item" data-action="show-plugins" data-nav-key="plugins">
          <span class="app-nav-label" data-i18n="nav.plugins">插件</span>
        </button>
        <button class="app-nav-item" data-action="show-assembly" data-nav-key="assembly">
          <span class="app-nav-label" data-i18n="nav.assembly">无工作区模式</span>
        </button>
        <button class="app-nav-item" data-action="show-memory" data-nav-key="memory">
          <span class="app-nav-label" data-i18n="nav.memory">记忆库</span>
        </button>
        <button class="app-nav-item app-nav-settings" data-action="open-settings" aria-label="设置" data-i18n-aria-label="nav.settings">
          <span class="ui-icon is-sm icon-settings" aria-hidden="true"></span>
          <span class="app-nav-label" data-i18n="nav.settings">设置</span>
        </button>
      </nav>
      <div class="shell-resizer shell-resizer-nav" role="separator" aria-orientation="vertical" aria-label="调整导航宽度" title="拖拽调整导航宽度"></div>
      <section class="app-workspace">
        <main id="app" tabindex="-1" aria-live="polite"></main>
      </section>
      <div class="shell-resizer shell-resizer-inspector" role="separator" aria-orientation="vertical" aria-label="调整检查器宽度" title="拖拽调整检查器宽度"></div>
      <aside id="appInspector" class="app-inspector" tabindex="-1" aria-label="任务检查器" hidden>
        <div class="inspector-tabs" role="tablist" aria-label="检查器内容">
          <button role="tab" data-action="open-inspector-tab" data-inspector-tab="context" data-i18n="inspector.contexts">上下文</button>
          <button role="tab" data-action="open-inspector-tab" data-inspector-tab="materials" data-i18n="inspector.materials">材料</button>
          <button role="tab" data-action="open-inspector-tab" data-inspector-tab="agents" data-i18n="inspector.agents">代理</button>
          <button role="tab" data-action="open-inspector-tab" data-inspector-tab="run" data-i18n="inspector.run">运行</button>
        </div>
        <div id="inspectorContent" class="inspector-content"></div>
      </aside>
    </div>
    <span id="zoomAnnouncement" class="visually-hidden" role="status" aria-live="polite"></span>
    <div id="overlayRoot" class="overlay-root" aria-live="polite"></div>
  </div>
  <dialog id="taskDialog">
    <form method="dialog" id="taskForm" class="dialog-form">
      <h2 data-i18n="dialog.new_task">新增工作区任务</h2>
      <label><span data-i18n="dialog.workspace_folder">工作区文件夹</span>
        <span class="path-picker"><input id="workspacePath" required><button type="button" data-action="pick-workspace" data-i18n="dialog.choose">选择</button></span>
      </label>
      <label><span data-i18n="dialog.task_title">任务标题</span><input id="threadTitle" value="新任务" required></label>
      <div class="dialog-actions"><button type="button" value="cancel" data-action="close-task-dialog" data-i18n="dialog.cancel">取消</button><button class="primary" type="submit" value="default" data-i18n="dialog.create">创建</button></div>
    </form>
  </dialog>
  <dialog id="settingsDialog" class="settings-dialog">
    <header class="settings-dialog-head">
      <div>
        <h2 data-i18n="settings.title">设置</h2>
        <span class="muted tiny" data-i18n="settings.subtitle">Focus 桌面配置</span>
      </div>
      <button class="quiet-button" data-action="close-settings" aria-label="关闭" data-i18n-aria-label="settings.close"><span class="ui-icon icon-x" aria-hidden="true"></span></button>
    </header>
    <nav class="settings-sections" role="tablist" aria-label="设置区块">
      <button role="tab" data-action="settings-tab" data-settings-tab="general" aria-selected="true" class="is-active" data-i18n="settings.general">常规</button>
      <button role="tab" data-action="settings-tab" data-settings-tab="data" aria-selected="false" data-i18n="settings.data">数据</button>
    </nav>
    <section class="settings-pane" data-settings-pane="general">
      <h3 data-i18n="settings.language">界面语言</h3>
      <div class="settings-language-options" role="radiogroup" aria-label="界面语言" data-i18n-aria-label="settings.language">
        <button type="button" data-action="set-language" data-locale="zh-CN" data-i18n="settings.chinese">中文</button>
        <button type="button" data-action="set-language" data-locale="en-US" data-i18n="settings.english">English</button>
      </div>
      <p class="muted tiny settings-language-help" data-i18n="settings.language_help">切换后立即应用，并保存在本机。</p>
    </section>
    <section class="settings-pane" data-settings-pane="data" hidden>
      <h3 data-i18n="settings.data">数据</h3>
      <section class="settings-data-section">
        <header><strong data-i18n="settings.archived">已归档的会话</strong><span class="muted tiny" data-i18n="settings.archived_help">归档可恢复；删除需确认</span></header>
        <div id="archivedSessions" class="archived-session-list"></div>
      </section>
    </section>
    <div class="settings-dialog-actions"><button class="text-button" data-action="close-settings" data-i18n="settings.close">关闭</button></div>
  </dialog>
  <template id="reviewTemplate">
    <article class="review-panel">
      <header>
        <div>
          <span class="review-kicker"></span>
          <h3></h3>
        </div>
        <span class="review-badge">等待确认</span>
      </header>
      <pre class="review-draft"></pre>
      <textarea class="review-contract-editor" aria-label="任务合同 Markdown" hidden></textarea>
      <p class="review-error" role="alert"></p>
      <div class="review-actions">
        <button class="primary approve-button" type="button">批准并继续</button>
        <button class="text-button revise-toggle" type="button">提出修订</button>
      </div>
      <form class="revision-form" hidden>
        <div class="segmented" role="group" aria-label="修订方式">
          <button class="active" type="button" data-mode="feedback">反馈</button>
          <button type="button" data-mode="replacement">替换草稿</button>
        </div>
        <textarea class="revision-input" rows="4" placeholder="输入需要调整的内容"></textarea>
        <div class="revision-footer">
          <button class="text-button cancel-revision" type="button">取消</button>
          <button class="primary" type="submit">提交修订</button>
        </div>
      </form>
    </article>
  </template>
  <template id="traceTemplate">
    <details class="trace-panel is-live" open>
      <summary>
        <span class="trace-summary-title">
          <span class="trace-live-dot" aria-hidden="true"></span>
          <span class="trace-state">思考中</span>
        </span>
        <span class="trace-summary-meta">
          <span class="trace-elapsed">已思考 0 秒</span>
          <span class="trace-count">0 项</span>
        </span>
      </summary>
      <ol class="trace-list"></ol>
    </details>
  </template>
  <template id="emptyTemplate">
    <section class="empty-state"><h1 data-i18n="empty.title">建立第一个工作区任务</h1><p data-i18n="empty.body">一个全图单元由本地工作区文件夹和线程共同组成。</p><button class="primary" data-action="new-task" data-i18n="empty.choose_folder">选择文件夹</button></section>
  </template>
  <script src="./vendor/markdown-it.min.js"></script>
  <script src="./i18n.js?v=20260908a"></script>
  <script src="./skill-picker.js"></script>
  <script src="./context-editor.js"></script>
  <script src="./compression-panel.js?v=20260905c"></script>
  <script src="./keyword-command.js?v=20260901"></script>
  <script src="./plugin-view.js"></script>
  <script src="./memory.js?v=20260829a"></script>
  <script src="./conversation-events.js"></script>
  <script src="./conversation-reconciler.js?v=20260907a"></script>
  <script src="./context-curator-presentation.js?v=20260906a"></script>
  <script src="./patrol-presence.js?v=20260905b"></script>
  <script src="./patrol-avatar.js?v=20260905b"></script>
  <script src="./map-collapsible-view.js?v=20260902"></script>
  <script src="./image-material-picker.js?v=20260911a"></script>
  <script src="./app.js?v=20260906b"></script>
</body>
</html>
