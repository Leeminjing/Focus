<!doctype html>
<!--
  本文档提供 Focus 桌面宿主的持久挂载结构。输入为 app.js 的同源数据与原生 DOM 更新，
  输出为全局导航、任务上下文、工作区、检查器、浮层、对话框和可复用模板。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Focus</title>
  <link rel="icon" href="./assets/focus-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./skill-picker.css">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/shell.css">
  <link rel="stylesheet" href="./styles/views.css">
  <link rel="stylesheet" href="./styles/conversation-events.css">
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <button class="brand" data-action="focus-home" aria-label="返回当前任务"><img src="./assets/focus-icon.png" alt="" aria-hidden="true"><span>Focus</span></button>
      <div class="shell-task-context" aria-live="polite">
        <strong id="shellTaskTitle">尚未选择任务</strong>
        <span id="shellTaskMeta">本地 Agent 工作台</span>
      </div>
      <span id="globalStatus" class="global-status" role="status" aria-atomic="true"></span>
      <button class="quiet-button" data-action="new-task">新增任务</button>
    </header>
    <div class="app-shell">
      <nav id="appNavigation" class="app-navigation" aria-label="全局导航">
        <button class="app-nav-item" data-action="focus-home" data-nav-key="focus">
          <span class="app-nav-icon" aria-hidden="true">⌂</span><span class="app-nav-label">任务</span>
        </button>
        <button class="app-nav-item" data-action="show-map" data-nav-key="map">
          <span class="app-nav-icon" aria-hidden="true">⊞</span><span class="app-nav-label">全图</span>
        </button>
        <button class="app-nav-item" data-action="show-contexts" data-nav-key="contexts">
          <span class="app-nav-icon" aria-hidden="true">⑂</span><span class="app-nav-label">Contexts</span>
        </button>
        <button class="app-nav-item" data-action="show-agents" data-nav-key="agents">
          <span class="app-nav-icon" aria-hidden="true">◎</span><span class="app-nav-label">Agents</span>
        </button>
        <button class="app-nav-item" data-action="show-plugins" data-nav-key="plugins">
          <span class="app-nav-icon" aria-hidden="true">◇</span><span class="app-nav-label">Plugins</span>
        </button>
      </nav>
      <section class="app-workspace">
        <header class="workspace-context">
          <div>
            <span id="workspaceKicker" class="workspace-kicker">WORKSPACE</span>
            <h1 id="workspaceTitle">任务</h1>
          </div>
          <span id="workspaceMeta" class="ui-meta"></span>
        </header>
        <main id="app" tabindex="-1" aria-live="polite"></main>
      </section>
      <aside id="appInspector" class="app-inspector" tabindex="-1" aria-labelledby="inspectorTitle" hidden>
        <header class="inspector-header">
          <div><span class="workspace-kicker">INSPECTOR</span><h2 id="inspectorTitle">任务信息</h2></div>
          <button class="icon-button" data-action="close-inspector" aria-label="关闭检查器">×</button>
        </header>
        <div class="inspector-tabs" role="tablist" aria-label="检查器内容">
          <button role="tab" data-action="open-inspector-tab" data-inspector-tab="context">Contexts</button>
          <button role="tab" data-action="open-inspector-tab" data-inspector-tab="materials">材料</button>
          <button role="tab" data-action="open-inspector-tab" data-inspector-tab="agents">Agents</button>
          <button role="tab" data-action="open-inspector-tab" data-inspector-tab="run">运行</button>
        </div>
        <div id="inspectorContent" class="inspector-content"></div>
      </aside>
    </div>
    <div id="overlayRoot" class="overlay-root" aria-live="polite"></div>
  </div>
  <dialog id="taskDialog">
    <form method="dialog" id="taskForm" class="dialog-form">
      <h2>新增工作区任务</h2>
      <label>工作区文件夹
        <span class="path-picker"><input id="workspacePath" required><button type="button" data-action="pick-workspace">选择</button></span>
      </label>
      <label>任务标题<input id="threadTitle" value="新任务" required></label>
      <div class="dialog-actions"><button type="button" value="cancel" data-action="close-task-dialog">取消</button><button class="primary" type="submit" value="default">创建</button></div>
    </form>
  </dialog>
  <dialog id="agentDialog" class="agent-dialog">
    <header class="agent-dialog-head">
      <div>
        <h2>小兵详情</h2>
        <span class="muted tiny" id="agentDialogMeta"></span>
      </div>
      <button class="quiet-button" data-action="close-agent-details" aria-label="关闭">×</button>
    </header>
    <div class="agent-dialog-history" id="agentHistory"></div>
    <div class="agent-dialog-actions">
      <button class="text-button" data-action="refresh-agent-details">刷新</button>
      <button class="text-button" data-action="retry-agent-details">重试</button>
      <button class="text-button danger" data-action="cancel-agent-details">取消运行</button>
    </div>
    <form class="agent-dialog-continue" id="agentContinueForm">
      <input id="agentContinueInput" placeholder="给小兵继续对话的消息…" autocomplete="off">
      <button class="primary" type="submit">继续</button>
    </form>
  </dialog>
  <template id="reviewTemplate">
    <article class="review-panel">
      <header>
        <div>
          <span class="review-kicker"></span>
          <h3></h3>
        </div>
        <span class="review-badge">等待确认</span>
      </header>
      <pre class="review-draft"></pre>
      <textarea class="review-contract-editor" aria-label="任务合同 Markdown" hidden></textarea>
      <p class="review-error" role="alert"></p>
      <div class="review-actions">
        <button class="primary approve-button" type="button">批准并继续</button>
        <button class="text-button revise-toggle" type="button">提出修订</button>
      </div>
      <form class="revision-form" hidden>
        <div class="segmented" role="group" aria-label="修订方式">
          <button class="active" type="button" data-mode="feedback">反馈</button>
          <button type="button" data-mode="replacement">替换草稿</button>
        </div>
        <textarea class="revision-input" rows="4" placeholder="输入需要调整的内容"></textarea>
        <div class="revision-footer">
          <button class="text-button cancel-revision" type="button">取消</button>
          <button class="primary" type="submit">提交修订</button>
        </div>
      </form>
    </article>
  </template>
  <template id="traceTemplate">
    <details class="trace-panel is-live" open>
      <summary>
        <span class="trace-summary-title">
          <span class="trace-live-dot" aria-hidden="true"></span>
          <span class="trace-state">思考中</span>
        </span>
        <span class="trace-summary-meta">
          <span class="trace-elapsed">已思考 0 秒</span>
          <span class="trace-count">0 项</span>
        </span>
      </summary>
      <ol class="trace-list"></ol>
    </details>
  </template>
  <template id="emptyTemplate">
    <section class="empty-state"><h1>建立第一个工作区任务</h1><p>一个全图单元由本地工作区文件夹和线程共同组成。</p><button class="primary" data-action="new-task">选择文件夹</button></section>
  </template>
  <script src="./vendor/markdown-it.min.js"></script>
  <script src="./skill-picker.js"></script>
  <script src="./context-editor.js"></script>
  <script src="./compression-panel.js"></script>
  <script src="./plugin-view.js"></script>
  <script src="./conversation-events.js"></script>
  <script src="./app.js"></script>
</body>
</html>
